name: 📲 Publish All KernelSU Managers to Release & Artifacts

on:
  workflow_dispatch: # Kích hoạt thủ công

permissions:
  contents: write # Cần quyền write để tạo GitHub Release

jobs:
  publish_manager:
    name: "Fetch, Archive & Release All Managers"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "🔍 Fetch Latest Manager APKs from All Repos"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apk_output
          REPOS=(
            "rsuntk/KernelSU"
            "tiann/KernelSU"
            "ReSukiSU/ReSukiSU"
            "backslashxx/KernelSU"
            "KOWX712/KernelSU"
          )

          COUNT=0

          for repo in "${REPOS[@]}"; do
            echo "----------------------------------------"
            echo "[*] Checking latest release in: $repo"
            OWNER="${repo%%/*}"
            
            # Gọi API lấy latest release
            API_URL="https://api.github.com/repos/${repo}/releases/latest"
            DATA=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API_URL")

            # Trích xuất download URL của APK và tag name
            APK_URL=$(echo "$DATA" | jq -r '.assets[]? | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
            VERSION_TAG=$(echo "$DATA" | jq -r '.tag_name // empty')

            # Nếu /releases/latest không có APK (ví dụ bản phát hành là pre-release), kiểm tra danh sách releases gần nhất
            if [ -z "$APK_URL" ] \vert{}\vert{} [ "$APK_URL" = "null" ]; then
              echo "[!] Not found in 'latest', scanning recent releases for $repo..."
              API_URL="https://api.github.com/repos/${repo}/releases"
              DATA=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API_URL")
              
              APK_INFO=$(echo "$DATA" | jq -r '
                [.[] | {tag: .tag_name, url: (.assets[]? | select(.name | endswith(".apk")) | .browser_download_url)}] 
                | map(select(.url != null)) | first // empty
              ')
              
              if [ -n "$APK_INFO" ]; then
                APK_URL=$(echo "$APK_INFO" | jq -r '.url')
                VERSION_TAG=$(echo "$APK_INFO" | jq -r '.tag')
              fi
            fi

            # Tải file nếu tìm thấy
            if [ -n "$APK_URL" ] && [ "$APK_URL" != "null" ]; then
              FILE_NAME="${OWNER}_Manager_${VERSION_TAG}.apk"
              echo "⬇️ Downloading from $repo ($VERSION_TAG) -> apk_output/$FILE_NAME"
              
              curl -fLSs -o "apk_output/$FILE_NAME" "$APK_URL" || wget -q -O "apk_output/$FILE_NAME" "$APK_URL"
              
              if [ -s "apk_output/$FILE_NAME" ]; then
                echo "✅ Saved: apk_output/$FILE_NAME"
                COUNT=$((COUNT + 1))
              else
                echo "⚠️ Download failed or empty file for $repo"
              fi
            else
              echo "❌ No APK found for $repo"
            fi
          done

          echo "----------------------------------------"
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No APKs downloaded from any repository!"
            exit 1
          fi

          echo "✅ Total APKs downloaded: $COUNT"
          RELEASE_TAG="KSU_Managers_$(date +'%Y%m%d_%H%M%S')"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

      - name: "📦 Upload APKs as Action Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Managers_All
          path: apk_output/*.apk
          retention-days: 7

      - name: "🚀 Publish to GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "KernelSU Managers Bundle (${{ env.RELEASE_TAG }})"
          body: |
            ### 📦 KernelSU Managers Collection
            Tự động tải về từ tất cả các repository:
            - `rsuntk/KernelSU`
            - `tiann/KernelSU`
            - `ReSukiSU/ReSukiSU`
            - `backslashxx/KernelSU`
            - `KOWX712/KernelSU`
          files: apk_output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
