name: 📲 Publish RKSU Manager to Release & Artifacts

on:
  workflow_dispatch: # Kích hoạt thủ công

permissions:
  contents: write # Cần quyền write để tạo GitHub Release

jobs:
  publish_manager:
    name: "Fetch, Archive & Release Manager"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "🔍 Fetch Latest Manager APK"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Contacting GitHub API for Manager APK..."
          REPOS=(
            "backslashxx/KernelSU"
            "rsuntk/KernelSU"
            "ReSukiSU/ReSukiSU"
            "tiann/KernelSU"
            "KOWX712/KernelSU"
          )

          APK_URL=""
          VERSION_TAG=""
          FOUND_OWNER=""

          for repo in "${REPOS[@]}"; do
            echo "[*] Checking latest release in: $repo"
            API_URL="https://api.github.com/repos/${repo}/releases/latest"
            DATA=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API_URL")

            # Trích xuất tag_name và browser_download_url của file .apk
            DOWNLOAD_URL=$(echo "$DATA" | jq -r '.assets[]? | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
            TAG=$(echo "$DATA" | jq -r '.tag_name // empty')

            if [ -n "$DOWNLOAD_URL" ] && [ "$DOWNLOAD_URL" != "null" ]; then
              APK_URL="$DOWNLOAD_URL"
              VERSION_TAG="$TAG"
              FOUND_OWNER="${repo%%/*}"
              echo "✅ Found APK in $repo ($VERSION_TAG): $APK_URL"
              break
            fi
          done

          if [ -z "$APK_URL" ]; then
            echo "❌ Failed to locate APK in any repository!"
            exit 1
          fi

          FILE_NAME="${FOUND_OWNER}_Manager_${VERSION_TAG}.apk"
          echo "[*] Downloading to $FILE_NAME..."
          curl -fLSs -o "$FILE_NAME" "$APK_URL" || wget -q -O "$FILE_NAME" "$APK_URL"

          
          # Check if file exists and is not empty
          if [ -s "$FILE_NAME" ]; then
            echo "APK_FILE=$FILE_NAME" >> $GITHUB_ENV
            echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
            echo "FOUND_OWNER=$FOUND_OWNER" >> $GITHUB_ENV
            echo "✅ Download complete: $FILE_NAME"
          else
            echo "❌ Failed to download APK!"
            exit 1
          fi

      - name: "📦 Upload APK as Action Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}
          retention-days: 7

      - name: "🚀 Publish to GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "${{ env.FOUND_OWNER }} Manager${{ env.VERSION_TAG }}"
          body: |
            ### 🔥 EXTREME++ Manager
            - **Source:** `${{ env.FOUND_OWNER }}`
            - **Version:** `${{ env.VERSION_TAG }}`
            - **Device:** POCO F4 (munch)
          files: ${{ env.APK_FILE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
