name: 📲 Publish RKSU Manager to Release & Artifacts

on:
  workflow_dispatch: # Kích hoạt thủ công

permissions:
  contents: write # Cần quyền write để tạo GitHub Release

jobs:
  publish_manager:
    name: "Fetch, Archive & Release Manager"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "🔍 Fetch Latest Manager APK"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Contacting GitHub API for Manager APK..."
          REPOS=(
            "rsuntk/KernelSU"
            "tiann/KernelSU"
            "ReSukiSU/ReSukiSU"
            "backslashxx/KernelSU"
            "KOWX712/KernelSU"
          )
          APK_URL=""
          VERSION_TAG=""
          FOUND_OWNER=""

          for repo in "${REPOS[@]}"; do
            echo "[*] Checking release source: $repo"
            API_URL="https://api.github.com/repos/${repo}/releases"
            DATA=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API_URL")
            FOUND_URL=$(echo "$DATA" | grep "browser_download_url" | grep -i "\.apk" | cut -d '"' -f 4 | head -n 1)
            if [ -n "$FOUND_URL" ]; then
              APK_URL="$FOUND_URL"
              VERSION_TAG=$(echo "$DATA" | grep '"tag_name":' | cut -d '"' -f 4 | head -n 1)
              FOUND_OWNER="${repo%%/*}"
              echo "✅ Located APK in $repo: tag $VERSION_TAG ->$APK_URL"
              break
            fi
          done

          if [ -z "$APK_URL" ]; then
            echo "❌ Failed to locate APK in any release repository!"
            exit 1
          fi

          echo "Downloading version: $VERSION_TAG from$FOUND_OWNER"
          FILE_NAME="${FOUND_OWNER}_Manager_${VERSION_TAG}.apk"
          
          curl -fLSs -o "$FILE_NAME" "$APK_URL" || wget -q -O "$FILE_NAME" "$APK_URL"
          
          # Check if file exists and is not empty
          if [ -s "$FILE_NAME" ]; then
            echo "APK_FILE=$FILE_NAME" >> $GITHUB_ENV
            echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
            echo "FOUND_OWNER=$FOUND_OWNER" >> $GITHUB_ENV
            echo "✅ Download complete: $FILE_NAME"
          else
            echo "❌ Failed to download APK!"
            exit 1
          fi

      - name: "📦 Upload APK as Action Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}
          retention-days: 7

      - name: "🚀 Publish to GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "${{ env.FOUND_OWNER }} Manager${{ env.VERSION_TAG }}"
          body: |
            ### 🔥 EXTREME++ Manager
            - **Source:** `${{ env.FOUND_OWNER }}`
            - **Version:** `${{ env.VERSION_TAG }}`
            - **Device:** POCO F4 (munch)
          files: ${{ env.APK_FILE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
