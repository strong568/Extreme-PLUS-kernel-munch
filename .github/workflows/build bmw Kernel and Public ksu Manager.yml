name: "🚀 Build bmw EXTREME++ Kernel & Publish with KSU Managers"

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Target Prime Frequency Variant'
        required: true
        type: choice
        options:
          - all
          - Battery
          - Bal-Gaming
          - Gaming
        default: all
      build_ksu:
        description: 'Integrate ReSukiSU Multi-Manager & Fetch All KSU Manager APKs'
        required: true
        type: boolean
        default: true

permissions:
  contents: write # Quyền tạo GitHub Release & upload assets
  actions: read   # Quyền đọc GitHub Actions Artifacts từ các repo KSU Manager

jobs:
  build:
    name: "Compile Kernel → Fetch Managers → Release"
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4

      - name: "🛠️ Install Full Build Dependencies & Dummy Environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip \
            device-tree-compiler libfdt-dev cpio kmod pahole dwarves jq unzip wget

          # Đảm bảo lệnh 'python' luôn trỏ về python3
          if ! command -v python &> /dev/null; then
            sudo ln -sf /usr/bin/python3 /usr/bin/python
          fi

          # Cấu hình Git giả lập (tránh lỗi khi setup.sh của ReSukiSU hoặc Baseband-guard chạy git apply/commit)
          git config --global user.name "strong568"
          git config --global user.email "extreme@extremeplusplus.dev"
          git config --global color.ui false
          git config --global init.defaultBranch main

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          curl -fLSs --retry 5 "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/zyc-clang
          rm clang.tar.gz

      - name: "🌐 Clone Kernel Source"
        run: |
          git clone --depth=1 -b android17-aptusitu https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel

      - name: "🛡️ Inject Patches & Harden build_kernel.sh (Anti-Fail Safeguards)"
        run: |
          if [ -d "patches" ]; then
            cp -rf patches/* kernel/
          fi
          cd kernel

          chmod +x build_kernel.sh
          chmod +x scripts/* 2>/dev/null || true

          # 1. Tạo các file dummy fallback nếu trong thư mục patches/ bị thiếu file phụ
          for py_script in apply-fastcharge-bypass.py apply-bootloader-spoof.py apply-eas-tuning.py apply-vmscan-critical.py apply-cpu-cap.py; do
            if [ ! -f "$py_script" ]; then
              echo "⚠️ Warning: $py_script missing in patches/, creating dummy no-op script..."
              cat > "$py_script" << 'EOF'
          #!/usr/bin/env python3
          import sys
          print(f"[Dummy Env] Skipped missing patch script: {sys.argv[0]}")
          sys.exit(0)
          EOF
            fi
            chmod +x "$py_script"
          done

          # 2. Sửa lỗi redefinition of 'task_is_booster' trong cpufreq_extreme_plus.c
          if [ -f "cpufreq_extreme_plus.c" ] && grep -q "task_is_booster" include/linux/binfmts.h 2>/dev/null; then
            sed -i '/static inline bool task_is_booster/d' cpufreq_extreme_plus.c
            echo "✅ Fixed duplicate task_is_booster in cpufreq_extreme_plus.c"
          fi

          # 3. Sửa lỗi current->comm (-Wpointer-bool-conversion) trong apply-bootloader-spoof.py
          if [ -f "apply-bootloader-spoof.py" ]; then
            sed -i 's/current->comm && //g' apply-bootloader-spoof.py
            echo "✅ Fixed current->comm check in apply-bootloader-spoof.py"
          fi

          # 4. Bọc lót các lệnh Python trong build_kernel.sh để không bị sập do 'set -e'
          sed -i 's/python3 apply-fastcharge-bypass.py/python3 apply-fastcharge-bypass.py || echo "⚠️ Fastcharge patch skipped"/g' build_kernel.sh
          sed -i 's/python3 apply-cpu-cap.py 3187200/python3 apply-cpu-cap.py 3187200 || echo "⚠️ CPU cap script fallback"/g' build_kernel.sh

          # 5. Đảm bảo thư mục ccache luôn tồn tại trước khi build
          mkdir -p "$HOME/.cache/ccache_mikernel"


      - name: "💾 Allocate 10GB Swap Memory (Anti-Crash Hack)"
        run: |
          echo "[*] Checking current RAM..."
          free -h
          echo "[*] Injecting 10GB Virtual RAM (Swap) on SSD..."
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "[*] New RAM Capacity:"
          free -h

      - name: "🔨 Compile EXTREME++ Kernel"
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Ho_Chi_Minh
          KBUILD_BUILD_USER: "PandeyJi"
          KBUILD_BUILD_HOST: "ExtremePlusPlus"
        run: |
          cd kernel
          TARGET_VAR="${{ inputs.variant }}"
          [ -z "$TARGET_VAR" ] && TARGET_VAR="all"
          KSU_MODE="noroot"
          if [ "${{ inputs.build_ksu }}" = "true" ]; then
            KSU_MODE="ksu"
          fi

          ./build_kernel.sh munch "$KSU_MODE" "$TARGET_VAR"

          echo "✅ Built ZIP files:"
          ls -lh EXTREME++*.zip

      - name: "🔍 Fetch Latest KernelSU Manager APKs (ARM64)"
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apk_output
          REPOS=(
            "rsuntk/KernelSU"
            "tiann/KernelSU"
            "Baka-SU/BakaSU"
            "SukiSU-Ultra/SukiSU-Ultra"
            "backslashxx/KernelSU"
            "KernelSU-Next/KernelSU-Next"
          )

          COUNT=0

          # ----------------------------------------------------
          # 1. Quét Releases từ các repo GitHub thông thường
          # ----------------------------------------------------
          for repo in "${REPOS[@]}"; do
            echo "========================================"
            echo "[*] Processing Release: $repo"
            OWNER="${repo%%/*}"
            
            API_URL="https://api.github.com/repos/${repo}/releases"
            DATA=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API_URL")

            if [[ "$repo" == "Baka-SU/BakaSU" ]]; then
              BAKA_REL_URL=$(echo "$DATA" | jq -r '
                [ .[].assets[]? | select(.name | test("bakasu.*\\.apk$"; "i")) ] | first | .browser_download_url // empty
              ')
              BAKA_REL_NAME=$(echo "$DATA" | jq -r '
                [ .[].assets[]? | select(.name | test("bakasu.*\\.apk$"; "i")) ] | first | .name // empty
              ')

              RESUKI_REL_URL=$(echo "$DATA" | jq -r '
                [ .[].assets[]? | select(.name | test("resuki.*\\.apk$|ksu.*\\.apk$"; "i")) ] | first | .browser_download_url // empty
              ')
              RESUKI_REL_NAME=$(echo "$DATA" | jq -r '
                [ .[].assets[]? | select(.name | test("resuki.*\\.apk$|ksu.*\\.apk$"; "i")) ] | first | .name // empty
              ')

              if [ -n "$BAKA_REL_URL" ]; then
                echo "⬇️ Downloading: Release_BakaSU_${BAKA_REL_NAME}"
                curl -fLSs -o "apk_output/Release_BakaSU_${BAKA_REL_NAME}" "$BAKA_REL_URL" || true
              fi

              if [ -n "$RESUKI_REL_URL" ]; then
                echo "⬇️ Downloading: Release_ReSukiSU_${RESUKI_REL_NAME}"
                curl -fLSs -o "apk_output/Release_ReSukiSU_${RESUKI_REL_NAME}" "$RESUKI_REL_URL" || true
              fi

              if [ -z "$BAKA_REL_URL" ] && [ -z "$RESUKI_REL_URL" ]; then
                GENERIC_APK=$(echo "$DATA" | jq -r '
                  [ .[].assets[]? | select(.name | test("arm64.*\\.apk$|\\.apk$"; "i")) ] | first // empty
                ')
                GEN_URL=$(echo "$GENERIC_APK" | jq -r '.browser_download_url // empty')
                GEN_NAME=$(echo "$GENERIC_APK" | jq -r '.name // empty')
                if [ -n "$GEN_URL" ]; then
                  echo "⬇️ Downloading generic BakaSU release: $GEN_NAME"
                  curl -fLSs -o "apk_output/Release_${GEN_NAME}" "$GEN_URL" || true
                fi
              fi
              continue
            fi

            ASSET_INFO=$(echo "$DATA" | jq -r '
              [ .[] | {
                  tag: .tag_name, 
                  asset: (
                    (.assets[]? | select(.name | test("arm64-v8a.*\\.apk$"; "i"))) //
                    (.assets[]? | select(.name | test("universal.*\\.apk$"; "i"))) //
                    (.assets[]? | select(.name | test("\\.apk$"; "i")))
                  )
                } 
              ] | map(select(.asset != null)) | first // empty
            ')

            APK_URL=$(echo "$ASSET_INFO" | jq -r '.asset.browser_download_url // empty')
            RAW_FILE_NAME=$(echo "$ASSET_INFO" | jq -r '.asset.name // empty')
            VERSION_TAG=$(echo "$ASSET_INFO" | jq -r '.tag // empty')

            if [ -n "$APK_URL" ]; then
              if [[ "$repo" == "SukiSU-Ultra/SukiSU-Ultra" ]]; then
                FILE_NAME="Release_SukiSU_${RAW_FILE_NAME}"
              elif [[ "$repo" == "KernelSU-Next/KernelSU-Next" ]]; then
                FILE_NAME="KernelSU_Next_Manager_${VERSION_TAG}.apk"
              else
                FILE_NAME="${OWNER}_Manager_${VERSION_TAG}.apk"
              fi

              echo "⬇️ Downloading: $FILE_NAME"
              curl -fLSs -o "apk_output/$FILE_NAME" "$APK_URL" || wget -q -O "apk_output/$FILE_NAME" "$APK_URL" || true
            else
              echo "⚠️ No APK asset found in Release of $repo"
            fi
          done

          # ----------------------------------------------------
          # 2. Lấy 3 kết quả APK Action từ Baka-SU/BakaSU (Chỉ ARM64)
          # ----------------------------------------------------
          echo "========================================"
          echo "[*] Fetching Actions Runs from Baka-SU/BakaSU..."

          BAKA_RUNS_JSON=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Baka-SU/BakaSU/actions/runs?status=completed&conclusion=success&per_page=30")

          BAKASU_PR_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '
            [ .workflow_runs[]? | select(
                ((.event == "pull_request") or (.head_branch | test("pr|pull"; "i")) or (.display_title | test("pr|pull request"; "i"))) and
                (.name | test("build.*manager|manager|ci"; "i"))
            ) ] | first | .id // empty
          ')

          RESUKISU_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '
            [ .workflow_runs[]? | select(
                ((.head_branch | test("resuki"; "i")) or (.name | test("resuki"; "i")) or (.display_title | test("resuki"; "i"))) and
                (.name | test("build.*manager|manager|ci"; "i"))
            ) ] | first | .id // empty
          ')

          BAKASU_MAIN_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '
            [ .workflow_runs[]? | select(
                (.event != "pull_request") and
                (.head_branch | test("main|master"; "i")) and
                ((.head_branch | test("resuki"; "i") | not) and (.display_title | test("resuki"; "i") | not)) and
                (.name | test("build.*manager|manager|ci"; "i"))
            ) ] | first | .id // empty
          ')

          if [ -z "$BAKASU_MAIN_RUN_ID" ]; then
            BAKASU_MAIN_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '
              [ .workflow_runs[]? | select(
                  .id != "'"$BAKASU_PR_RUN_ID"'" and .id != "'"$RESUKISU_RUN_ID"'" and
                  (.name | test("build.*manager|manager|ci"; "i"))
              ) ] | first | .id // empty
            ')
          fi

          fetch_bakasu_action() {
            local R_ID="$1"
            local PREFIX="$2"

            [ -z "$R_ID" ] && return 0

            echo "[⬇️] Processing $PREFIX (Run ID:$R_ID)..."
            local ART_JSON=$(curl -sL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Baka-SU/BakaSU/actions/runs/${R_ID}/artifacts")

            echo "$ART_JSON" | jq -c '.artifacts[]? | select(.name | test("manager|apk"; "i"))' | while read -r art; do
              local ART_NAME=$(echo "$art" | jq -r '.name')
              local ART_URL=$(echo "$art" | jq -r '.archive_download_url')

              curl -fLSs \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -o "temp_${PREFIX}_${ART_NAME}.zip" \
                "$ART_URL" || true

              if [ -s "temp_${PREFIX}_${ART_NAME}.zip" ]; then
                mkdir -p "ext_${PREFIX}_${ART_NAME}"
                unzip -q -o "temp_${PREFIX}_${ART_NAME}.zip" -d "ext_${PREFIX}_${ART_NAME}/"

                local CHOSEN_APK=$(find "ext_${PREFIX}_${ART_NAME}" -type f -name "*.apk" | grep -iE "arm64-v8a.*release|arm64.*release" | head -n 1)
                if [ -z "$CHOSEN_APK" ]; then
                  CHOSEN_APK=$(find "ext_${PREFIX}_${ART_NAME}" -type f -name "*.apk" | grep -i "arm64" | head -n 1)
                fi

                if [ -n "$CHOSEN_APK" ]; then
                  local RAW_NAME=$(basename "$CHOSEN_APK")
                  local FINAL_NAME="${PREFIX}_${RAW_NAME}"
                  cp "$CHOSEN_APK" "apk_output/$FINAL_NAME"
                  echo "✅ Saved (ARM64 only): apk_output/$FINAL_NAME"
                fi

                rm -rf "temp_${PREFIX}_${ART_NAME}.zip" "ext_${PREFIX}_${ART_NAME}"
              fi
            done
          }

          fetch_bakasu_action "$BAKASU_MAIN_RUN_ID" "Action_BakaSU"
          fetch_bakasu_action "$BAKASU_PR_RUN_ID"   "Action_BakaSU_PR"
          fetch_bakasu_action "$RESUKISU_RUN_ID"    "Action_ReSukiSU"

          # ----------------------------------------------------
          # 3. Lấy APK mới nhất từ SukiSU-Ultra Actions Artifacts (Chỉ ARM64)
          # ----------------------------------------------------
          echo "========================================"
          echo "[*] Fetching latest artifact from SukiSU-Ultra/SukiSU-Ultra actions..."

          SUKI_RUN_ID=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs?status=completed&conclusion=success&per_page=5" \
            | jq -r '
              ( [ .workflow_runs[]? | select(.name | test("build|manager|ci"; "i")) | .id ] | first ) //
              .workflow_runs[0].id // empty
            ')

          if [ -n "$SUKI_RUN_ID" ]; then
            SUKI_ARTIFACTS=$(curl -sL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs/${SUKI_RUN_ID}/artifacts")

            SUKI_DL_URL=$(echo "$SUKI_ARTIFACTS" | jq -r '
              [ .artifacts[]? | select(.name | test("manager|apk|sukisu"; "i")) ] | first | .archive_download_url // empty
            ')

            if [ -n "$SUKI_DL_URL" ]; then
              curl -fLSs \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -o "sukisu_temp.zip" \
                "$SUKI_DL_URL" || true

              if [ -s "sukisu_temp.zip" ]; then
                mkdir -p sukisu_extracted
                unzip -q -o "sukisu_temp.zip" -d sukisu_extracted/

                FOUND_SUKI_APK=$(find sukisu_extracted -type f -name "*.apk" | grep -iE "arm64-v8a|arm64" | head -n 1)
                [ -z "$FOUND_SUKI_APK" ] && FOUND_SUKI_APK=$(find sukisu_extracted -type f -name "*.apk" | head -n 1)

                if [ -n "$FOUND_SUKI_APK" ]; then
                  ORIGINAL_NAME=$(basename "$FOUND_SUKI_APK")
                  TARGET_NAME="Action_SukiSU_${ORIGINAL_NAME}"
                  cp "$FOUND_SUKI_APK" "apk_output/$TARGET_NAME"
                  echo "✅ Saved SukiSU Action APK (ARM64): apk_output/$TARGET_NAME"
                fi
                rm -rf sukisu_temp.zip sukisu_extracted
              fi
            fi
          fi

          # ----------------------------------------------------
          # 4. Lấy APK mới nhất từ KOWX712 Actions Artifacts
          # ----------------------------------------------------
          echo "========================================"
          echo "[*] Fetching latest artifact from KOWX712/KernelSU actions..."

          KOWX_RUN_ID=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/KOWX712/KernelSU/actions/runs?status=completed&conclusion=success&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')

          if [ -n "$KOWX_RUN_ID" ]; then
            ARTIFACTS_DATA=$(curl -sL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/KOWX712/KernelSU/actions/runs/${KOWX_RUN_ID}/artifacts")

            ARTIFACT_DOWNLOAD_URL=$(echo "$ARTIFACTS_DATA" | jq -r '
              [ .artifacts[]? | select(.name | test("manager|apk"; "i")) ] | first | .archive_download_url // empty
            ')

            if [ -n "$ARTIFACT_DOWNLOAD_URL" ]; then
              curl -fLSs \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -o "kowx_temp.zip" \
                "$ARTIFACT_DOWNLOAD_URL" || true

              if [ -s "kowx_temp.zip" ]; then
                mkdir -p kowx_extracted
                unzip -q -o "kowx_temp.zip" -d kowx_extracted/
                
                FOUND_KOWX_APK=$(find kowx_extracted -type f -name "*.apk" | grep -i "arm64" | head -n 1)
                [ -z "$FOUND_KOWX_APK" ] && FOUND_KOWX_APK=$(find kowx_extracted -type f -name "*.apk" | head -n 1)

                if [ -n "$FOUND_KOWX_APK" ]; then
                  ORIGINAL_NAME=$(basename "$FOUND_KOWX_APK")
                  TARGET_NAME="KOWX_${ORIGINAL_NAME}"
                  cp "$FOUND_KOWX_APK" "apk_output/$TARGET_NAME"
                  echo "✅ Saved KOWX APK: apk_output/$TARGET_NAME"
                fi
                rm -rf kowx_temp.zip kowx_extracted
              fi
            fi
          fi

          echo "========================================"
          COUNT=$(find apk_output -type f -name "*.apk" | wc -l)
          echo "Total Manager APKs fetched: $COUNT"

      - name: "🗂️ Prepare Release Metadata"
        if: success()
        run: |
          RELEASE_TAG="EXTREME++_munch_Build${{ github.run_number }}_$(date +'%Y%m%d_%H%M%S')"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

          if [ "${{ inputs.build_ksu }}" = "true" ]; then
            echo "ROOT_STATUS=⚡ Inbuilt ReSukiSU / RKSU Multi-Manager (SuSFS v2.3.0)" >> $GITHUB_ENV
          else
            echo "ROOT_STATUS=🛡️ Pure Clean Base (No Root)" >> $GITHUB_ENV
          fi

      - name: "📦 Upload Kernel ZIPs & Manager APKs to Artifacts"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EXTREME++_Release_Bundle_${{ github.run_number }}
          path: |
            kernel/EXTREME++*.zip
            apk_output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: "🚀 Publish Kernel & KSU Managers to GitHub Release"
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "🔥 EXTREME++ Kernel #${{ github.run_number }} (${{ inputs.variant }}) + KSU Managers"
          body: |
            ### 🔥 EXTREME++ Official Release #${{ github.run_number }}
            - **📱 Device:** POCO F4 (`munch`)
            - **⚡ Target ROM:** HyperOS / MIUI Android 13–17
            - **🛠️ Toolchain:** ZyC-Clang 16.0.6 + LLD
            - **👑 Maintainer:** PandeyJI-9
            - **🔐 Root Architecture:** ${{ env.ROOT_STATUS }}
            - **🎯 Built Variant(s):** `${{ inputs.variant }}`

            ---
            ### ✨ Variants Overview
            - **🔋 Battery:** ~2.5GHz (`2419200 kHz`) - Massive Battery Backup
            - **⚖️ Bal-Gaming:** 2.84GHz (`2841600 kHz`) - Sustained 90 FPS & Zero Throttling
            - **🚀 Gaming:** Truly 3.2GHz (`3187200 kHz`) - Pure Performance Monster

            ---
            ### 📲 Included KernelSU Managers (ARM64 Collection)
            Universal signature verification patched inside `apk_sign.c` supports:
            - **Official:** `tiann/KernelSU` (`me.weishu.kernelsu`)
            - **Rissu / SuSFS:** `rsuntk/KernelSU`
            - **ReSukiSU & BakaSU (Release + CI ARM64):** `Baka-SU/BakaSU` (`org.resukisu.resukisu`, `org.bakasu.bakasu`)
            - **SukiSU-Ultra (Release + CI ARM64):** `SukiSU-Ultra/SukiSU-Ultra` (`com.sukisu.ultra`)
            - **Backslashxx:** `backslashxx/KernelSU`
            - **KernelSU-Next:** `KernelSU-Next/KernelSU-Next`
            - **KOWX712:** `KOWX712/KernelSU` (`com.kowx712.supermanager`)
          files: |
            kernel/EXTREME++*.zip
            apk_output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
