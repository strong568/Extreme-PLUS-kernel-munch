name: "🚀 Auto Build Kernel (Dùng auto_build_kernel.py từ Repo ngoài)"

on:
  workflow_dispatch: # Cho phép kích hoạt chạy thủ công trên GitHub[span_1](start_span)[span_1](end_span)

jobs:
  build_kernel:
    name: "Build Kernel via Python"
    runs-on: ubuntu-22.04 # Môi trường Linux bắt buộc[span_2](start_span)[span_2](end_span)
    timeout-minutes: 180 # Giới hạn 180 phút để tránh treo máy ảo[span_3](start_span)[span_3](end_span)

    steps:
      - name: "📦 Checkout mã nguồn"
        uses: actions/checkout@v4

      - name: "📥 Tải file auto_build_kernel.py từ link GitHub"
        run: |
          # Chuyển đổi link github.com thành raw.githubusercontent.com để tải file trực tiếp
          wget https://raw.githubusercontent.com/strong568/Extreme-PLUS-kernel-munch/munch-dev.main_multi_ksu/patches/auto_build_kernel.py -O auto_build_kernel.py

      - name: "🚀 Thực thi file auto_build_kernel.py"
        run: |
          # File Python cần quyền sudo để cài đặt thư viện apt và tạo swap[span_4](start_span)[span_4](end_span)
          sudo python3 auto_build_kernel.py

      - name: "📦 Upload file Kernel ZIP (Artifacts)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EXTREME_PLUS_PLUS_KERNEL
          path: kernel/EXTREME++*.zip # Lấy các file zip sinh ra sau khi build xong[span_5](start_span)[span_5](end_span)
          if-no-files-found: warn
          
