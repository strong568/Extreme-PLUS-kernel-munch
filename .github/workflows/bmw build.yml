name: "🚀 Build bmw EXTREME++ Kernel (BMW Edition - Dynamic Profiles)"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Config/Patches Repo Branch'
        required: true
        type: string
        default: 'bmw_multi_ksu'
      build_ksu:
        description: 'Integrate KernelSU (Multi-Manager & SuSFS)'
        required: true
        type: boolean
        default: true
      ksu_provider:
        description: 'Select KernelSU Source Variant'
        required: true
        type: choice
        default: 'midori01/KernelSU'
        options:
          - 'midori01/KernelSU'
          - 'ReSukiSU/ReSukiSU'
          - 'Baka-SU/BakaSU'
          - 'rsuntk/KernelSU'
          - 'tiann/KernelSU'
          - 'SukiSU-Ultra/SukiSU-Ultra'
          - 'backslashxx/KernelSU'
          - 'KernelSU-Next/KernelSU-Next'
          - 'KOWX712/KernelSU'
      target_os:
        description: 'Target OS: both | hyperos | aosp'
        required: true
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'hyperos'
          - 'aosp'

jobs:
  build:
    name: "Compile → Release"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    timeout-minutes: 180 

    steps:
      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip unzip zlib1g-dev python3 python3-pip jq

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          curl -L "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/zyc-clang
          rm clang.tar.gz

      - name: "🌐 Clone kernel source"
        run: |
          git clone --depth=1 -b android17-aptusitu https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel

      - name: "⚙️ Inject PandeyJI Custom Build Script"
        run: |
          cp patches/* kernel/
          chmod +x kernel/build_kernel.sh

      - name: "💾 Allocate 10GB Swap Memory (Anti-Crash Hack)"
        run: |
          echo "[*] Checking current RAM..."
          free -h
          echo "[*] Injecting 10GB Virtual RAM (Swap) on SSD..."
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "[*] New RAM Capacity:"
          free -h

      - name: "🔨 Compile EXTREME++ Kernel"
        run: |
          cd kernel
          
          # Fix lỗi sdcardfs
          [ -f "fs/sdcardfs/main.c" ] && sed -i 's/SDCARDFS_VERSION/"2.0"/g' fs/sdcardfs/main.c || true

          # Fix lỗi audio codec TFA9874
          TFA_DIR="techpack/audio/asoc/codecs/tfa9874"
          if [ -d "$TFA_DIR" ]; then
              [ -f "${TFA_DIR}/src/tfa98xx.c" ] && sed -i 's/#include "config.h"/\/\/ #include "config.h"/g' "${TFA_DIR}/src/tfa98xx.c" || true
              [ -f "${TFA_DIR}/Makefile" ] && echo "ccflags-y += -I\$(srctree)/${TFA_DIR}/inc -I\$(srctree)/${TFA_DIR}/src" >> "${TFA_DIR}/Makefile" || true
              find "$TFA_DIR" -name "tfa98xx.h" -exec cp {} "${TFA_DIR}/src/" \; 2>/dev/null || true
              touch "${TFA_DIR}/src/tfa98xx.h" "${TFA_DIR}/inc/tfa98xx.h" || true
          fi

          # Khử sạch -Werror trên TOÀN BỘ source tree
          echo "[*] Cleaning all -Werror occurrences..."
          find . -type f \( -name "Makefile*" -o -name "Kbuild*" -o -name "*.mk" \) -exec sed -i -E 's/-Werror[a-zA-Z0-9_=-]*/-Wno-error/g' {} + 2>/dev/null || true
          find . -type f \( -name "Makefile*" -o -name "Kbuild*" -o -name "*.mk" \) -exec sed -i 's/-Werror//g' {} + 2>/dev/null || true

          KSU_MODE="noroot"
          if [ "${{ inputs.build_ksu }}" = "true" ]; then
            KSU_MODE="ksu"
          fi
          ./build_kernel.sh munch "$KSU_MODE" "${{ inputs.target_os }}" "${{ inputs.ksu_provider }}"
          
          echo "✅ Built ZIP files:"
          ls -lh EXTREME++*.zip

      - name: "📦 Package Raw Kernel Images for HyperOS 4 (.img / dtb)"
        if: success()
        run: |
          echo "[*] Checking for HyperOS raw images (.img / dtb) for HyperOS 4 developer testing..."
          IMG_DIR="$GITHUB_WORKSPACE/raw_kernel_images_staging"
          OUT_ZIP_DIR="$GITHUB_WORKSPACE/raw_images"
          mkdir -p "$IMG_DIR" "$OUT_ZIP_DIR"

          HYPEROS_BOOT="$GITHUB_WORKSPACE/kernel/out_hyperos/arch/arm64/boot"
          if [ ! -d "$HYPEROS_BOOT" ]; then
            HYPEROS_BOOT="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"
          fi

          if [ -d "$HYPEROS_BOOT" ] && [ -f "$HYPEROS_BOOT/Image" ]; then
            cp -f "$HYPEROS_BOOT/Image" "$IMG_DIR/Image"
            cp -f "$HYPEROS_BOOT/Image" "$IMG_DIR/kernel.img"
            echo "  [+] Included Image & kernel.img from $HYPEROS_BOOT/Image ($(du -h "$IMG_DIR/Image" | cut -f1))"

            if [ -f "$HYPEROS_BOOT/dtbo.img" ]; then
              cp -f "$HYPEROS_BOOT/dtbo.img" "$IMG_DIR/dtbo.img"
              echo "  [+] Included dtbo.img from $HYPEROS_BOOT/dtbo.img"
            fi

            if [ -f "$HYPEROS_BOOT/dtb" ]; then
              cp -f "$HYPEROS_BOOT/dtb" "$IMG_DIR/dtb"
              cp -f "$HYPEROS_BOOT/dtb" "$IMG_DIR/dtb.img"
              echo "  [+] Included dtb & dtb.img from $HYPEROS_BOOT/dtb"
            elif [ -f "$HYPEROS_BOOT/dtb.img" ]; then
              cp -f "$HYPEROS_BOOT/dtb.img" "$IMG_DIR/dtb.img"
              cp -f "$HYPEROS_BOOT/dtb.img" "$IMG_DIR/dtb"
              echo "  [+] Included dtb.img from $HYPEROS_BOOT/dtb.img"
            fi

            find "$HYPEROS_BOOT" -maxdepth 1 -name "*.img" -exec cp -f {} "$IMG_DIR/" \; 2>/dev/null || true

            RAW_ZIP_NAME="EXTREME++_HyperOS4_Raw_Images_Build_${{ github.run_number }}.zip"
            (
              cd "$IMG_DIR"
              zip -9 -r "$OUT_ZIP_DIR/$RAW_ZIP_NAME" ./*
            )
            rm -rf "$IMG_DIR"

            echo "✅ Created HyperOS 4 Raw Images ZIP: $OUT_ZIP_DIR/$RAW_ZIP_NAME ($(du -h "$OUT_ZIP_DIR/$RAW_ZIP_NAME" | cut -f1))"
            echo "RAW_IMAGES_ZIP_PATH=$OUT_ZIP_DIR/$RAW_ZIP_NAME" >> $GITHUB_ENV
            echo "RAW_IMAGES_ZIP_NAME=$RAW_ZIP_NAME" >> $GITHUB_ENV
          else
            echo "ℹ️ HyperOS output not found (e.g. chỉ chọn build AOSP). Bỏ qua Raw Images ZIP."
          fi

      - name: "📱 Fetch Full Multi-Manager Suite (Releases & Actions ARM64)"
        if: success() && inputs.build_ksu == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/managers"
          cd "$GITHUB_WORKSPACE/managers"

          REPOS=(
            "midori01/KernelSU"
            "rsuntk/KernelSU"
            "tiann/KernelSU"
            "Baka-SU/BakaSU"
            "SukiSU-Ultra/SukiSU-Ultra"
            "backslashxx/KernelSU"
            "KernelSU-Next/KernelSU-Next"
          )

          for repo in "${REPOS[@]}"; do
            echo "========================================"
            echo "[*] Processing Release: $repo"
            OWNER="${repo%%/*}"
            
            API_URL="https://api.github.com/repos/${repo}/releases"
            DATA=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API_URL")

            if [[ "$repo" == "Baka-SU/BakaSU" ]]; then
              BAKA_REL_URL=$(echo "$DATA" | jq -r '
                [ .[].assets[]? | select(.name | test("bakasu.*\\.apk$"; "i")) ] | first | .browser_download_url // empty
              ')
              BAKA_REL_NAME=$(echo "$DATA" | jq -r '
                [ .[].assets[]? | select(.name | test("bakasu.*\\.apk$"; "i")) ] | first | .name // empty
              ')

              RESUKI_REL_URL=$(echo "$DATA" | jq -r '
                [ .[].assets[]? | select(.name | test("resuki.*\\.apk$|ksu.*\\.apk$"; "i")) ] | first | .browser_download_url // empty
              ')
              RESUKI_REL_NAME=$(echo "$DATA" | jq -r '
                [ .[].assets[]? | select(.name | test("resuki.*\\.apk$|ksu.*\\.apk$"; "i")) ] | first | .name // empty
              ')

              if [ -n "$BAKA_REL_URL" ]; then
                echo "⬇️ Downloading: Release_BakaSU_${BAKA_REL_NAME}"
                curl -fLSs -o "Release_BakaSU_${BAKA_REL_NAME}" "$BAKA_REL_URL" || true
              fi

              if [ -n "$RESUKI_REL_URL" ]; then
                echo "⬇️ Downloading: Release_ReSukiSU_${RESUKI_REL_NAME}"
                curl -fLSs -o "Release_ReSukiSU_${RESUKI_REL_NAME}" "$RESUKI_REL_URL" || true
              fi
              continue
            fi

            ASSET_INFO=$(echo "$DATA" | jq -r '
              [ .[] | {
                  tag: .tag_name, 
                  asset: (
                    (.assets[]? | select(.name | test("arm64-v8a.*\\.apk$"; "i"))) //
                    (.assets[]? | select(.name | test("universal.*\\.apk$"; "i"))) //
                    (.assets[]? | select(.name | test("\\.apk$"; "i")))
                  )
                } 
              ] | map(select(.asset != null)) | first // empty
            ')

            APK_URL=$(echo "$ASSET_INFO" | jq -r '.asset.browser_download_url // empty')
            RAW_FILE_NAME=$(echo "$ASSET_INFO" | jq -r '.asset.name // empty')
            VERSION_TAG=$(echo "$ASSET_INFO" | jq -r '.tag // empty')

            if [ -n "$APK_URL" ]; then
              if [[ "$repo" == "SukiSU-Ultra/SukiSU-Ultra" ]]; then
                FILE_NAME="Release_SukiSU_${RAW_FILE_NAME}"
              elif [[ "$repo" == "KernelSU-Next/KernelSU-Next" ]]; then
                FILE_NAME="KernelSU_Next_Manager_${VERSION_TAG}.apk"
              elif [[ "$repo" == "midori01/KernelSU" ]]; then
                FILE_NAME="Release_midori01_${RAW_FILE_NAME}"
              else
                FILE_NAME="${OWNER}_Manager_${VERSION_TAG}.apk"
              fi

              echo "⬇️ Downloading: $FILE_NAME"
              curl -fLSs -o "$FILE_NAME" "$APK_URL" || true
            fi
          done

          echo "========================================"
          echo "[*] Fetching Actions Runs from Baka-SU/BakaSU..."

          BAKA_RUNS_JSON=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Baka-SU/BakaSU/actions/runs?status=completed&conclusion=success&per_page=30")

          BAKASU_PR_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '
            [ .workflow_runs[] | select(
                ((.event == "pull_request") or (.head_branch | test("pr|pull"; "i")) or (.display_title | test("pr|pull request"; "i"))) and
                (.name | test("build.*manager|manager|ci"; "i"))
            ) ] | first | .id // empty
          ')

          RESUKISU_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '
            [ .workflow_runs[] | select(
                ((.head_branch | test("resuki"; "i")) or (.name | test("resuki"; "i")) or (.display_title | test("resuki"; "i"))) and
                (.name | test("build.*manager|manager|ci"; "i"))
            ) ] | first | .id // empty
          ')

          BAKASU_MAIN_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '
            [ .workflow_runs[] | select(
                (.event != "pull_request") and
                (.head_branch | test("main|master"; "i")) and
                ((.head_branch | test("resuki"; "i") | not) and (.display_title | test("resuki"; "i") | not)) and
                (.name | test("build.*manager|manager|ci"; "i"))
            ) ] | first | .id // empty
          ')

          if [ -z "$BAKASU_MAIN_RUN_ID" ]; then
            BAKASU_MAIN_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '
              [ .workflow_runs[] | select(
                  .id != "'"$BAKASU_PR_RUN_ID"'" and .id != "'"$RESUKISU_RUN_ID"'" and
                  (.name | test("build.*manager|manager|ci"; "i"))
              ) ] | first | .id // empty
            ')
          fi

          echo "[*] Detected Runs: Main=${BAKASU_MAIN_RUN_ID:-None}, PR=${BAKASU_PR_RUN_ID:-None}, ReSukiSU=${RESUKISU_RUN_ID:-None}"

          fetch_bakasu_action() {
            local R_ID="$1"
            local PREFIX="$2"

            [ -z "$R_ID" ] && return 0

            echo "[⬇️] Processing $PREFIX (Run ID:$R_ID)..."
            local ART_JSON=$(curl -sL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Baka-SU/BakaSU/actions/runs/${R_ID}/artifacts")

            echo "$ART_JSON" | jq -c '.artifacts[]? | select(.name | test("manager|apk"; "i"))' | while read -r art; do
              local ART_NAME=$(echo "$art" | jq -r '.name')
              local ART_URL=$(echo "$art" | jq -r '.archive_download_url')

              curl -fLSs \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -o "temp_${PREFIX}_${ART_NAME}.zip" \
                "$ART_URL" || true

              if [ -s "temp_${PREFIX}_${ART_NAME}.zip" ]; then
                mkdir -p "ext_${PREFIX}_${ART_NAME}"
                unzip -q -o "temp_${PREFIX}_${ART_NAME}.zip" -d "ext_${PREFIX}_${ART_NAME}/" || true

                local CHOSEN_APK=$(find "ext_${PREFIX}_${ART_NAME}" -type f -name "*.apk" | grep -iE "arm64-v8a.*release|arm64.*release" | head -n 1)
                if [ -z "$CHOSEN_APK" ]; then
                  CHOSEN_APK=$(find "ext_${PREFIX}_${ART_NAME}" -type f -name "*.apk" | grep -i "arm64" | head -n 1)
                fi

                if [ -n "$CHOSEN_APK" ]; then
                  local RAW_NAME=$(basename "$CHOSEN_APK")
                  local FINAL_NAME="${PREFIX}_${RAW_NAME}"
                  cp "$CHOSEN_APK" "$FINAL_NAME"
                  echo "✅ Saved (ARM64): $FINAL_NAME"
                fi

                rm -rf "temp_${PREFIX}_${ART_NAME}.zip" "ext_${PREFIX}_${ART_NAME}"
              fi
            done
          }

          fetch_bakasu_action "$BAKASU_MAIN_RUN_ID" "Action_BakaSU"
          fetch_bakasu_action "$BAKASU_PR_RUN_ID"   "Action_BakaSU_PR"
          fetch_bakasu_action "$RESUKISU_RUN_ID"    "Action_ReSukiSU"

          echo "========================================"
          echo "[*] Fetching latest artifact from SukiSU-Ultra/SukiSU-Ultra actions..."

          SUKI_RUN_ID=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs?status=completed&conclusion=success&per_page=5" \
            | jq -r '
              ( [ .workflow_runs[] | select(.name | test("build|manager|ci"; "i")) | .id ] | first ) //
              .workflow_runs[0].id // empty
            ')

          if [ -n "$SUKI_RUN_ID" ]; then
            SUKI_ARTIFACTS=$(curl -sL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs/${SUKI_RUN_ID}/artifacts")

            SUKI_DL_URL=$(echo "$SUKI_ARTIFACTS" | jq -r '
              [ .artifacts[] | select(.name | test("manager|apk|sukisu"; "i")) ] | first | .archive_download_url // empty
            ')

            if [ -n "$SUKI_DL_URL" ]; then
              curl -fLSs \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -o "sukisu_temp.zip" \
                "$SUKI_DL_URL" || true

              if [ -s "sukisu_temp.zip" ]; then
                mkdir -p sukisu_extracted
                unzip -q -o "sukisu_temp.zip" -d sukisu_extracted/ || true

                FOUND_SUKI_APK=$(find sukisu_extracted -type f -name "*.apk" | grep -iE "arm64-v8a|arm64" | head -n 1)
                [ -z "$FOUND_SUKI_APK" ] && FOUND_SUKI_APK=$(find sukisu_extracted -type f -name "*.apk" | head -n 1)

                if [ -n "$FOUND_SUKI_APK" ]; then
                  ORIGINAL_NAME=$(basename "$FOUND_SUKI_APK")
                  TARGET_NAME="Action_SukiSU_${ORIGINAL_NAME}"
                  cp "$FOUND_SUKI_APK" "$TARGET_NAME"
                  echo "✅ Saved SukiSU Action APK (ARM64): $TARGET_NAME"
                fi
                rm -rf sukisu_temp.zip sukisu_extracted
              fi
            fi
          fi

          echo "========================================"
          echo "[*] Fetching latest artifact from KOWX712/KernelSU actions..."

          KOWX_RUN_ID=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/KOWX712/KernelSU/actions/runs?status=completed&conclusion=success&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')

          if [ -n "$KOWX_RUN_ID" ]; then
            ARTIFACTS_DATA=$(curl -sL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/KOWX712/KernelSU/actions/runs/${KOWX_RUN_ID}/artifacts")

            ARTIFACT_DOWNLOAD_URL=$(echo "$ARTIFACTS_DATA" | jq -r '
              [ .artifacts[] | select(.name | test("manager|apk"; "i")) ] | first | .archive_download_url // empty
            ')

            if [ -n "$ARTIFACT_DOWNLOAD_URL" ]; then
              curl -fLSs \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -o "kowx_temp.zip" \
                "$ARTIFACT_DOWNLOAD_URL" || true

              if [ -s "kowx_temp.zip" ]; then
                mkdir -p kowx_extracted
                unzip -q -o "kowx_temp.zip" -d kowx_extracted/ || true
                
                FOUND_KOWX_APK=$(find kowx_extracted -type f -name "*.apk" | grep -i "arm64" | head -n 1)
                [ -z "$FOUND_KOWX_APK" ] && FOUND_KOWX_APK=$(find kowx_extracted -type f -name "*.apk" | head -n 1)

                if [ -n "$FOUND_KOWX_APK" ]; then
                  ORIGINAL_NAME=$(basename "$FOUND_KOWX_APK")
                  TARGET_NAME="KOWX_${ORIGINAL_NAME}"
                  cp "$FOUND_KOWX_APK" "$TARGET_NAME"
                  echo "✅ Saved KOWX APK: $TARGET_NAME"
                fi
                rm -rf kowx_temp.zip kowx_extracted
              fi
            fi
          fi

          echo "========================================"
          echo "✅ Danh sách toàn bộ KSU Manager đã sẵn sàng:"
          ls -lh

      - name: "📦 Upload Build Artifacts (CI Artifacts)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EXTREME++_BMW_Edition_BETA_${{ github.run_number }}
          path: |
            kernel/EXTREME++*.zip
            raw_images/*.zip
            managers/*.apk
          if-no-files-found: warn

      - name: "🚀 Publish to GitHub Releases"
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "EXTREME++ BMW Edition - Build #${{ github.run_number }}"
          body: |
            ### 🚀 EXTREME++ BMW Edition (POCO F4 - munch)
            * **Build Number:** #${{ github.run_number }}
            * **Config/Patches Branch:** ${{ inputs.branch }}
            * **Kernel Branch:** android17-aptusitu
            * **Target OS:** ${{ inputs.target_os }}
            * **KSU Engine:** ${{ inputs.ksu_provider }}
            * **Toolchain:** ZyC-Clang 16.0.6 + LLD
          files: |
            kernel/EXTREME++*.zip
            raw_images/*.zip
            managers/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
