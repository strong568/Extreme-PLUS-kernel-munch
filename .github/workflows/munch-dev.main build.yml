name: "🚀 Build munch-dev.main_multi_ksu Kernel & Release"

on:
  workflow_dispatch:
    inputs:
      patch_branch:
        description: 'Branch containing patches (Config Repo)'
        required: true
        type: string
        default: 'munch-dev.main_multi_ksu'
      build_ksu:
        description: 'ReSukiSU Integrate KowSU (KOWX712 Multi-Manager & SuSFS)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS: both | hyperos | aosp'
        required: true
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'hyperos'
          - 'aosp'

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: "Compile → Release"
    runs-on: ubuntu-22.04
    timeout-minutes: 180 

    steps:
      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.patch_branch }}

      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip jq unzip wget

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          curl -L "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/zyc-clang
          rm clang.tar.gz

      - name: "🌐 Clone kernel source"
        run: |
          git clone --depth=1 -b main https://github.com/munch-devs/android_kernel_xiaomi_munch kernel

      - name: "⚙️ Setup Auto-config for munch-devs (Prevent build hang)"
        run: |
          echo "[*] Setting KCONFIG_NOTIMESTAMP and Yes to all default config prompts..."
          export KCONFIG_NOTIMESTAMP=1
          export KCONFIG_ALLCONFIG=1


      - name: "⚙️ Inject PandeyJI Custom Build Script"
        run: |
          cp patches/* kernel/ || true
          chmod +x kernel/build_kernel.sh

      - name: "💾 Allocate 10GB Swap Memory (Anti-Crash Hack)"
        run: |
          echo "[*] Injecting 10GB Virtual RAM (Swap) on SSD..."
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: "🔨 Compile EXTREME++ Kernel"
        run: |
          cd kernel
          KSU_MODE="noroot"
          if [ "${{ inputs.build_ksu }}" = "true" ]; then
            KSU_MODE="ksu"
          fi
          ./build_kernel.sh munch "$KSU_MODE" "${{ inputs.target_os }}"
          echo "✅ Built ZIP files:"
          ls -lh EXTREME++*.zip

      - name: "🔍 Scan SuSFS Version & Rename Kernel ZIPs"
        if: success()
        run: |
          if [ "${{ inputs.build_ksu }}" = "true" ]; then
            echo "[*] Scanning for SuSFS version in kernel source..."
            SUSFS_VER=$(grep -rhoP '#define\s+SUSFS_VERSION\s+"\K[^"]+' kernel/ 2>/dev/null | head -n 1)
            if [ -z "$SUSFS_VER" ]; then
              SUSFS_VER="v2.3.0"
            fi
            echo "SuSFS Version found: $SUSFS_VER"
            
            echo "SUSFS_VER=$SUSFS_VER" >> $GITHUB_ENV
            
            for z in kernel/EXTREME++*.zip; do
              if [ -f "$z" ]; then
                NEW_NAME=$(echo "$z" | sed "s/\.zip/_Susfs_${SUSFS_VER}.zip/")
                mv "$z" "$NEW_NAME"
                echo "Renamed to: $NEW_NAME"
              fi
            done
          fi

      - name: "📦 Package Raw Kernel Images for HyperOS 4"
        if: success()
        run: |
          echo "[*] Checking for HyperOS raw images (.img / dtb)..."
          IMG_DIR="$GITHUB_WORKSPACE/raw_kernel_images_staging"
          OUT_ZIP_DIR="$GITHUB_WORKSPACE/raw_images"
          mkdir -p "$IMG_DIR" "$OUT_ZIP_DIR"

          HYPEROS_BOOT="$GITHUB_WORKSPACE/kernel/out_hyperos/arch/arm64/boot"
          if [ ! -d "$HYPEROS_BOOT" ]; then
            HYPEROS_BOOT="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"
          fi

          if [ -d "$HYPEROS_BOOT" ] && [ -f "$HYPEROS_BOOT/Image" ]; then
            cp -f "$HYPEROS_BOOT/Image" "$IMG_DIR/Image"
            cp -f "$HYPEROS_BOOT/Image" "$IMG_DIR/kernel.img"
            [ -f "$HYPEROS_BOOT/dtbo.img" ] && cp -f "$HYPEROS_BOOT/dtbo.img" "$IMG_DIR/dtbo.img"
            
            if [ -f "$HYPEROS_BOOT/dtb" ]; then
              cp -f "$HYPEROS_BOOT/dtb" "$IMG_DIR/dtb"
              cp -f "$HYPEROS_BOOT/dtb" "$IMG_DIR/dtb.img"
            elif [ -f "$HYPEROS_BOOT/dtb.img" ]; then
              cp -f "$HYPEROS_BOOT/dtb.img" "$IMG_DIR/dtb.img"
              cp -f "$HYPEROS_BOOT/dtb.img" "$IMG_DIR/dtb"
            fi
            find "$HYPEROS_BOOT" -maxdepth 1 -name "*.img" -exec cp -f {} "$IMG_DIR/" \; 2>/dev/null || true

            RAW_ZIP_NAME="EXTREME++_HyperOS4_Raw_Images_Build_${{ github.run_number }}.zip"
            if [ "${{ inputs.build_ksu }}" = "true" ] && [ -n "$SUSFS_VER" ]; then
              RAW_ZIP_NAME="EXTREME++_HyperOS4_Raw_Images_Build_${{ github.run_number }}_Susfs_${SUSFS_VER}.zip"
            fi

            (cd "$IMG_DIR" && zip -9 -r "$OUT_ZIP_DIR/$RAW_ZIP_NAME" ./*)
            rm -rf "$IMG_DIR"
            echo "✅ Created HyperOS 4 Raw Images ZIP: $OUT_ZIP_DIR/$RAW_ZIP_NAME"
          else
            echo "ℹ️ HyperOS output not found. Skipping raw images."
          fi

      - name: "🔍 Fetch Latest Manager APKs (Releases & Actions)"
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apk_output
          REPOS=(
            "rsuntk/KernelSU"
            "tiann/KernelSU"
            "Baka-SU/BakaSU"
            "SukiSU-Ultra/SukiSU-Ultra"
            "backslashxx/KernelSU"
            "KernelSU-Next/KernelSU-Next"
            "midori01/KernelSU"
          )
          
          # 1. Quét Releases
          for repo in "${REPOS[@]}"; do
            echo "[*] Processing Release: $repo"
            OWNER="${repo%%/*}"
            API_URL="https://api.github.com/repos/${repo}/releases"
            DATA=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API_URL")

            if [[ "$repo" == "Baka-SU/BakaSU" ]]; then
              BAKA_REL_URL=$(echo "$DATA" | jq -r '[ .[].assets[]? | select(.name | test("bakasu.*\\.apk$"; "i")) ] | first | .browser_download_url // empty')
              BAKA_REL_NAME=$(echo "$DATA" | jq -r '[ .[].assets[]? | select(.name | test("bakasu.*\\.apk$"; "i")) ] | first | .name // empty')
              RESUKI_REL_URL=$(echo "$DATA" | jq -r '[ .[].assets[]? | select(.name | test("resuki.*\\.apk$|ksu.*\\.apk$"; "i")) ] | first | .browser_download_url // empty')
              RESUKI_REL_NAME=$(echo "$DATA" | jq -r '[ .[].assets[]? | select(.name | test("resuki.*\\.apk$|ksu.*\\.apk$"; "i")) ] | first | .name // empty')

              if [ -n "$BAKA_REL_URL" ]; then
                curl -fLSs -o "apk_output/Release_BakaSU_${BAKA_REL_NAME}" "$BAKA_REL_URL"
              fi
              if [ -n "$RESUKI_REL_URL" ]; then
                curl -fLSs -o "apk_output/Release_ReSukiSU_${RESUKI_REL_NAME}" "$RESUKI_REL_URL"
              fi
              continue
            fi

            ASSET_INFO=$(echo "$DATA" | jq -r '[ .[] | { tag: .tag_name, asset: ( (.assets[]? | select(.name | test("arm64-v8a.*\\.apk$"; "i"))) // (.assets[]? | select(.name | test("universal.*\\.apk$"; "i"))) // (.assets[]? | select(.name | test("\\.apk$"; "i"))) ) } ] | map(select(.asset != null)) | first // empty')
            APK_URL=$(echo "$ASSET_INFO" | jq -r '.asset.browser_download_url // empty')
            RAW_FILE_NAME=$(echo "$ASSET_INFO" | jq -r '.asset.name // empty')
            VERSION_TAG=$(echo "$ASSET_INFO" | jq -r '.tag // empty')

            if [ -n "$APK_URL" ]; then
              if [[ "$repo" == "SukiSU-Ultra/SukiSU-Ultra" ]]; then
                FILE_NAME="Release_SukiSU_${RAW_FILE_NAME}"
              elif [[ "$repo" == "KernelSU-Next/KernelSU-Next" ]]; then
                FILE_NAME="KernelSU_Next_Manager_${VERSION_TAG}.apk"
              elif [[ "$repo" == "midori01/KernelSU" ]]; then
                FILE_NAME="Release_midori01_${RAW_FILE_NAME}"
              else
                FILE_NAME="${OWNER}_Manager_${VERSION_TAG}.apk"
              fi
              curl -fLSs -o "apk_output/$FILE_NAME" "$APK_URL" || wget -q -O "apk_output/$FILE_NAME" "$APK_URL"
            fi
          done

          # Hàm fetch action apk (được cải tiến để hiển thị rõ quá trình đưa ra APK)
          fetch_action_apk() {
            local R_ID="$1"; local REPO_API="$2"; local PREFIX="$3"
            [ -z "$R_ID" ] && return 0
            echo "[*] Fetching artifact for $PREFIX (Run ID: $R_ID) from $REPO_API..."
            local ART_JSON=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO_API}/actions/runs/${R_ID}/artifacts")
            
            echo "$ART_JSON" | jq -c '.artifacts[]? | select(.name | test("manager|apk|sukisu|ksu"; "i"))' | while read -r art; do
              local ART_NAME=$(echo "$art" | jq -r '.name')
              local ART_URL=$(echo "$art" | jq -r '.archive_download_url')
              
              echo "  ⬇️ Downloading artifact: $ART_NAME"
              curl -fLSs -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "temp_art.zip" "$ART_URL"
              if [ -s "temp_art.zip" ]; then
                mkdir -p ext_art
                unzip -q -o "temp_art.zip" -d ext_art/
                
                # Ưu tiên ARM64
                local CHOSEN_APK=$(find ext_art -type f -name "*.apk" | grep -iE "arm64-v8a.*release|arm64.*release" | head -n 1)
                [ -z "$CHOSEN_APK" ] && CHOSEN_APK=$(find ext_art -type f -name "*.apk" | grep -i "arm64" | head -n 1)
                [ -z "$CHOSEN_APK" ] && CHOSEN_APK=$(find ext_art -type f -name "*.apk" | head -n 1)

                if [ -n "$CHOSEN_APK" ]; then
                  local FINAL_FILE="apk_output/${PREFIX}_$(basename "$CHOSEN_APK")"
                  cp "$CHOSEN_APK" "$FINAL_FILE"
                  echo "  ✅ Đưa ra APK thành công: $FINAL_FILE"
                else
                  echo "  ⚠️ Không tìm thấy file APK bên trong Artifact này!"
                fi
                rm -rf temp_art.zip ext_art
              fi
            done
          }

          # 2. Lấy BakaSU Actions (Main, PR, ReSukiSU)
          echo "========================================"
          echo "[*] Fetching Actions Runs from Baka-SU/BakaSU..."
          BAKA_RUNS_JSON=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Baka-SU/BakaSU/actions/runs?status=completed&conclusion=success&per_page=30")
          
          BAKASU_PR_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '[ .workflow_runs[] | select( ((.event == "pull_request") or (.head_branch | test("pr|pull"; "i")) or (.display_title | test("pr|pull request"; "i"))) and (.name | test("build.*manager|manager|ci"; "i")) ) ] | first | .id // empty')
          RESUKISU_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '[ .workflow_runs[] | select( ((.head_branch | test("resuki"; "i")) or (.name | test("resuki"; "i")) or (.display_title | test("resuki"; "i"))) and (.name | test("build.*manager|manager|ci"; "i")) ) ] | first | .id // empty')
          BAKASU_MAIN_RUN_ID=$(echo "$BAKA_RUNS_JSON" | jq -r '[ .workflow_runs[] | select( (.event != "pull_request") and (.head_branch | test("main|master"; "i")) and ((.head_branch | test("resuki"; "i") | not) and (.display_title | test("resuki"; "i") | not)) and (.name | test("build.*manager|manager|ci"; "i")) ) ] | first | .id // empty')

          fetch_action_apk "$BAKASU_MAIN_RUN_ID" "Baka-SU/BakaSU" "Action_BakaSU"
          fetch_action_apk "$BAKASU_PR_RUN_ID" "Baka-SU/BakaSU" "Action_BakaSU_PR"
          fetch_action_apk "$RESUKISU_RUN_ID" "Baka-SU/BakaSU" "Action_ReSukiSU"

          # 3. Lấy SukiSU-Ultra Actions
          echo "========================================"
          SUKI_RUN_ID=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs?status=completed&conclusion=success&per_page=5" | jq -r '( [ .workflow_runs[] | select(.name | test("build|manager|ci"; "i")) | .id ] | first ) // .workflow_runs[0].id // empty')
          fetch_action_apk "$SUKI_RUN_ID" "SukiSU-Ultra/SukiSU-Ultra" "Action_SukiSU"

          # 4. Lấy KOWX712 Actions (Được tinh chỉnh để ưu tiên tìm Manager build)
          echo "========================================"
          KOWX_RUN_ID=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/KOWX712/KernelSU/actions/runs?status=completed&conclusion=success&per_page=10" | jq -r '( [ .workflow_runs[] | select(.name | test("build|manager|ci"; "i")) | .id ] | first ) // .workflow_runs[0].id // empty')
          fetch_action_apk "$KOWX_RUN_ID" "KOWX712/KernelSU" "Action_KOWX712"

          # 5. Lấy midori01 Actions
          echo "========================================"
          MIDORI_RUN_ID=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/midori01/KernelSU/actions/runs?status=completed&conclusion=success&per_page=10" | jq -r '( [ .workflow_runs[] | select(.name | test("build|manager|ci"; "i")) | .id ] | first ) // .workflow_runs[0].id // empty')
          fetch_action_apk "$MIDORI_RUN_ID" "midori01/KernelSU" "Action_midori01"

      - name: "📦 Upload Build Artifacts (Backup)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EXTREME++_Files_${{ github.run_number }}
          path: |
            kernel/EXTREME++*.zip
            raw_images/*.zip
            apk_output/*.apk
          if-no-files-found: warn

      - name: "🚀 Publish to GitHub Release"
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Build_${{ github.run_number }}_${{ github.sha }}"
          name: "EXTREME++ Kernel (Build #${{ github.run_number }})"
          body: |
            ### 🚀 EXTREME++ Kernel Build
            - **Device:** POCO F4 (munch)
            - **Patches Branch:** ${{ inputs.patch_branch }}
            - **Target OS:** ${{ inputs.target_os }}
            - **Root/SuSFS Included:** ${{ inputs.build_ksu }}
            
            **📦 Included Files:**
            - Flashable Kernel ZIPs
            - Raw Kernel Images for Fastboot (If HyperOS)
            - Latest KernelSU Managers (Official, BakaSU, SuSFS, ReSukiSU, KOWX712, Midori01...)
          files: |
            kernel/EXTREME++*.zip
            raw_images/*.zip
            apk_output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
