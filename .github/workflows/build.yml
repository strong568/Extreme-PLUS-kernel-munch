name: "🚀 Build EXTREME++ Kernel (Dual Variant: 3.2GHz & 2.8GHz)"

on:
  workflow_dispatch:
    inputs:
      build_ksu:
        description: 'Build with Root (RKSU:ReSukiSU, SukiSU)?'
        required: true
        type: boolean
        default: true
      variant:
        description: 'Target Prime Frequency Variant'
        required: true
        type: choice
        options:
          - both
          - 3.2GHz
          - 2.8GHz
        default: both

jobs:
  build:
    name: "Compile → Release"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 180 

    steps:
      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4

      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip jq

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          curl -L "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/zyc-clang
          rm clang.tar.gz

      - name: "🌐 Clone kernel source"
        run: |
          git clone --depth=1 -b android17-aptusitu https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel

      - name: "⚙️ Inject PandeyJI Custom Build Script"
        run: |
          cp patches/* kernel/
          chmod +x kernel/build_kernel.sh

      # Fix Swap Memory
      - name: "💾 Allocate 10GB Swap Memory (Anti-Crash Hack)"
        run: |
          echo "[*] Checking current RAM..."
          free -h
          echo "[*] Injecting 10GB Virtual RAM (Swap) on SSD..."
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "[*] New RAM Capacity:"
          free -h

      - name: "🔨 Compile EXTREME++ Kernel"
        run: |
          cd kernel
          TARGET_VAR="${{ inputs.variant }}"
          [ -z "$TARGET_VAR" ] && TARGET_VAR="both"
          if [ "${{ inputs.build_ksu }}" == "false" ]; then
            ./build_kernel.sh munch noroot "$TARGET_VAR"
          else
            ./build_kernel.sh munch ksu "$TARGET_VAR"
          fi

          BUILD_DATE=$(TZ='Asia/Ho_Chi_Minh' date +'%Y%m%d')

          for file in *munch*.zip; do
            [ -e "$file" ] || continue
            BASE_NAME="${file%.zip}"
            if [ "${{ inputs.build_ksu }}" == "true" ]; then
              NEW_NAME="${BASE_NAME}-SUSFS-${BUILD_DATE}.zip"
            else
              NEW_NAME="${BASE_NAME}-${BUILD_DATE}.zip"
            fi
            mv "$file" "$NEW_NAME"
            echo "Renamed: $file -> $NEW_NAME"
          done
          
          echo "✅ Built ZIP files:"
          ls -lh *munch*.zip

      - name: "📝 Generate Release Notes & Fetch Managers"
        id: release_info
        run: |
          BUILD_DATE=$(TZ='Asia/Ho_Chi_Minh' date +'%Y%m%d')
          TAG_NAME="v${{ github.run_number }}-${BUILD_DATE}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # 1. Lấy link Release ReSukiSU mới nhất
          RESUKISU_URL=$(curl -s "https://api.github.com/repos/ShirkNeko/ReSukiSU/releases/latest" | jq -r '.html_url // "https://github.com/ShirkNeko/ReSukiSU/releases"')

          # 2. Lấy link Run Action 'Build Manager' thành công mới nhất của SukiSU-Ultra
          API_RES=$(curl -s "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs?status=success&branch=main")
          SUKISU_ACTION_URL=$(echo "$API_RES" | jq -r '[.workflow_runs[] | select(.name | test("Build Manager"; "i"))][0].html_url // empty')
          SUKISU_RUN_NUM=$(echo "$API_RES" | jq -r '[.workflow_runs[] | select(.name | test("Build Manager"; "i"))][0].run_number // empty')

          if [ -z "$SUKISU_ACTION_URL" ]; then
            SUKISU_ACTION_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra/actions"
            SUKISU_TITLE="SukiSU-Ultra CI Actions"
          else
            SUKISU_TITLE="SukiSU-Ultra Build Manager #${SUKISU_RUN_NUM}"
          fi

          cat << 'EOF' > release_body.md
          ## 🔥 EXTREME++ Kernel Release #${{ github.run_number }}

          * **Device:** POCO F4 (munch)
          * **Target ROM:** HyperOS / MIUI (Android 13–17)
          * **Toolchain:** ZyC-Clang 16.0.6 + LLD
          * **Root Option:** ReSukiSU Non-GKI 4.19 + SuSFS (Enabled: ${{ inputs.build_ksu }})
          * **Variant:** ${{ inputs.variant }}
          * **Build Date:** $(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y')

          ---

          ### ✨ Key Features
          * **Dual Variants:** 3.2GHz Benchmark & 2.8GHz Cool Gaming
          * **Network:** TCP BBR Congestion Control (Low Ping in BGMI/COD)
          * **GPU:** FakeDreamer 150MHz - 670MHz UV & msm-adreno-tz
          * **Storage:** Zero-Overhead Block I/O Stats Disabled
          * **Memory:** Smart LMK Sniper Method & App Protection
          * **Governor:** 100% Safe Schedutil Boot + EXTREME+ Module

          ---

          ### 📱 Recommended Root Managers (As of Build Date)
          EOF

          echo "* **ReSukiSU Manager (Release):** [Tải bản mới nhất tại đây]($RESUKISU_URL)" >> release_body.md
          echo "* **SukiSU Manager (CI Action mới nhất):** [${SUKISU_TITLE}]($SUKISU_ACTION_URL)" >> release_body.md

      - name: "🚀 Publish to GitHub Releases"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "EXTREME++ Kernel Release #${{ github.run_number }}"
          body_path: release_body.md
          files: kernel/*munch*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
