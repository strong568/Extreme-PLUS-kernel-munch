name: "🚀 Build EXTREME++ Kernel (KowSU Multi-Manager & All Variants)"

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Target Prime Frequency Variant'
        required: true
        type: choice
        options:
          - all
          - Battery
          - Bal-Gaming
          - Gaming
        default: all
      build_ksu:
        description: 'Integrate KowSU (KOWX712 Multi-Manager & SuSFS)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: "Compile → Release"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 180

    steps:
      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4

      - name: "🛠️ Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip jq

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          curl -L "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/zyc-clang
          rm clang.tar.gz

      - name: "🌐 Clone kernel source"
        run: |
          git clone --depth=1 -b android17-aptusitu https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel

      - name: "⚙️ Inject PandeyJI Custom Build Script"
        run: |
          cp patches/* kernel/
          chmod +x kernel/build_kernel.sh

      - name: "💾 Allocate 10GB Swap Memory (Anti-Crash Hack)"
        run: |
          echo "[*] Checking current RAM..."
          free -h
          echo "[*] Injecting 10GB Virtual RAM (Swap) on SSD..."
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "[*] New RAM Capacity:"
          free -h

      - name: "🔨 Compile EXTREME++ Kernel"
        run: |
          cd kernel
          TARGET_VAR="${{ inputs.variant }}"
          [ -z "$TARGET_VAR" ] && TARGET_VAR="all"

          KSU_MODE="noroot"
          if [ "${{ inputs.build_ksu }}" = "true" ]; then
            KSU_MODE="ksu"
          fi

          ./build_kernel.sh munch "$KSU_MODE" "$TARGET_VAR"

          BUILD_DATE=$(TZ='Asia/Ho_Chi_Minh' date +'%Y%m%d')

          for file in EXTREME++*.zip; do
            [ -e "$file" ] || continue
            BASE_NAME="${file%.zip}"
            if [ "${{ inputs.build_ksu }}" = "true" ]; then
              NEW_NAME="${BASE_NAME}-KowSU-SuSFS-${BUILD_DATE}.zip"
            else
              NEW_NAME="${BASE_NAME}-${BUILD_DATE}.zip"
            fi
            mv "$file" "$NEW_NAME"
            echo "Renamed: $file -> $NEW_NAME"
          done

          echo "✅ Final ZIP files:"
          ls -lh EXTREME++*.zip

      - name: "📝 Generate Release Notes & Fetch Managers"
        id: release_info
        run: |
          BUILD_DATE=$(TZ='Asia/Ho_Chi_Minh' date +'%Y%m%d')
          TAG_NAME="v${{ github.run_number }}-${BUILD_DATE}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Fetch KowSU Manager (CI Run ID & URL)
          KOWSU_RUN_ID=$(curl -s "https://api.github.com/repos/KOWX712/KernelSU/actions/runs?status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')

          if [ -n "$KOWSU_RUN_ID" ]; then
            KOWSU_URL="https://github.com/KOWX712/KernelSU/actions/runs/${KOWSU_RUN_ID}"
            KOWSU_TITLE="KowSU Multi-Manager CI Run #${KOWSU_RUN_ID}"
          else
            KOWSU_URL="https://github.com/KOWX712/KernelSU/actions"
            KOWSU_TITLE="KowSU Multi-Manager Actions"
          fi

          # Fetch ReSukiSU Release
          RESUKISU_URL=$(curl -s "https://api.github.com/repos/ShirkNeko/ReSukiSU/releases/latest" | jq -r '.html_url // "https://github.com/Baka-SU/BakaSU/releases"')

          # Fetch SukiSU-Ultra CI Run
          API_RES=$(curl -s "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs?status=success&branch=main")
          SUKISU_ACTION_URL=$(echo "$API_RES" | jq -r '[.workflow_runs[] | select(.name | test("Build Manager"; "i"))][0].html_url // empty')
          SUKISU_RUN_NUM=$(echo "$API_RES" | jq -r '[.workflow_runs[] | select(.name | test("Build Manager"; "i"))][0].run_number // empty')

          if [ -z "$SUKISU_ACTION_URL" ]; then
            SUKISU_ACTION_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra/actions"
            SUKISU_TITLE="SukiSU-Ultra CI Actions"
          else
            SUKISU_TITLE="SukiSU-Ultra Build Manager #${SUKISU_RUN_NUM}"
          fi

          cat << EOF > release_body.md
          ## 🔥 EXTREME++ Kernel Release #${{ github.run_number }}

          * **Device:** POCO F4 (munch)
          * **Target ROM:** HyperOS / MIUI (Android 13–17)
          * **Toolchain:** ZyC-Clang 16.0.6 + LLD
          * **Root Engine:** KowSU Multi-Manager & SuSFS Non-GKI (Enabled: ${{ inputs.build_ksu }})
          * **Variant:** ${{ inputs.variant }}
          * **Build Date:** $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S') (GMT+7)

          ---

          ### ✨ Key Features
          * **Tri-Variant Profiles:** Battery (~2.5GHz), Bal-Gaming (2.84GHz), Gaming Monster (3.2GHz)
          * **Networking:** TCP BBR Congestion Control (Low Latency / Ping)
          * **GPU Optimization:** FakeDreamer 150MHz - 670MHz UV & msm-adreno-tz
          * **Storage:** Zero-Overhead Block I/O Stats Disabled
          * **Memory Management:** Smart LMK Sniper & Background App Protection
          * **Governor:** Safe Schedutil Boot + Module Tuning

          ---

          ### 📱 Supported & Recommended KSU Managers
          * 🦊 **KowSU Multi-Manager (Primary):** [${KOWSU_TITLE}](${KOWSU_URL})
          * ⚡ **ReSukiSU Manager:** [Tải bản mới nhất tại đây](${RESUKISU_URL})
          * 🛡️ **SukiSU Manager (CI Auto-Build):** [${SUKISU_TITLE}](${SUKISU_ACTION_URL})
          EOF

      - name: "📦 Upload Build Artifacts"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EXTREME++_Artifacts_${{ github.run_number }}
          path: kernel/EXTREME++*.zip
          if-no-files-found: error

      - name: "🚀 Publish to GitHub Releases"
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "EXTREME++ Kernel Release #${{ github.run_number }}"
          body_path: release_body.md
          files: kernel/EXTREME++*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
