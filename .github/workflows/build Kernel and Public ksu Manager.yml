name: "🚀 Build EXTREME++ Kernel & Publish with KSU Managers"

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Target Prime Frequency Variant'
        required: true
        type: choice
        options:
          - all
          - Battery
          - Bal-Gaming
          - Gaming
        default: all
      build_ksu:
        description: 'Integrate Multi-Manager & Fetch All KSU Manager APKs'
        required: true
        type: boolean
        default: true
      ksu_flavor:
        description: 'Select KernelSU Core Base'
        required: true
        type: choice
        options:
          - ReSukiSU-MultiManager
          - SukiSU-Ultra
          - KernelSU-Next
          - KowSU
        default: ReSukiSU-MultiManager

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: "Compile Kernel → Fetch Managers → Release"
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: "📦 Checkout config repo"
        uses: actions/checkout@v4

      - name: "🛠️ Install Full Build Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip \
            device-tree-compiler libfdt-dev cpio kmod pahole dwarves jq unzip wget

          if ! command -v python &> /dev/null; then
            sudo ln -sf /usr/bin/python3 /usr/bin/python
          fi

          git config --global user.name "PandeyJI-9"
          git config --global user.email "pandeyji@extremeplusplus.dev"
          git config --global color.ui false
          git config --global init.defaultBranch main

      - name: "⚡ Setup ZyC-Clang 16"
        run: |
          mkdir -p $HOME/zyc-clang
          curl -fLSs --retry 5 "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/zyc-clang
          rm clang.tar.gz

      - name: "🌐 Clone Kernel Source"
        run: |
          git clone --depth=1 -b android17-aptusitu https://github.com/AstideLabs/android_kernel_xiaomi_sm8250 kernel

      - name: "🛡️ Inject Patches & Harden build_kernel.sh"
        run: |
          if [ -d "patches" ]; then
            cp -rf patches/* kernel/
          fi
          cd kernel
          chmod +x build_kernel.sh
          chmod +x scripts/* 2>/dev/null || true

          for py_script in apply-fastcharge-bypass.py apply-bootloader-spoof.py apply-eas-tuning.py apply-vmscan-critical.py apply-cpu-cap.py; do
            if [ ! -f "$py_script" ]; then
              cat > "$py_script" << 'EOF'
          #!/usr/bin/env python3
          import sys
          sys.exit(0)
          EOF
            fi
            chmod +x "$py_script"
          done

          if [ "${{ inputs.build_ksu }}" = "true" ]; then
            if [ "${{ inputs.ksu_flavor }}" = "SukiSU-Ultra" ]; then
              sed -i -E 's|https://raw\.githubusercontent\.com/[^/]+/[^/]+/(refs/heads/)?[^/]+/kernel/setup\.sh(\|[[:space:]]*bash([[:space:]]+-s[[:space:]]+--[[:space:]]+[^[:space:]]+)?)?|https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \| bash -|g' build_kernel.sh
            elif [ "${{ inputs.ksu_flavor }}" = "KernelSU-Next" ]; then
              sed -i -E 's|https://raw\.githubusercontent\.com/[^/]+/[^/]+/(refs/heads/)?[^/]+/kernel/setup\.sh(\|[[:space:]]*bash([[:space:]]+-s[[:space:]]+--[[:space:]]+[^[:space:]]+)?)?|https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \| bash -|g' build_kernel.sh
            elif [ "${{ inputs.ksu_flavor }}" = "KowSU" ]; then
              sed -i -E 's|https://raw\.githubusercontent\.com/[^/]+/[^/]+/(refs/heads/)?[^/]+/kernel/setup\.sh(\|[[:space:]]*bash([[:space:]]+-s[[:space:]]+--[[:space:]]+[^[:space:]]+)?)?|https://raw.githubusercontent.com/KOWX712/KernelSU/main/kernel/setup.sh \| bash -|g' build_kernel.sh
            fi
          fi

          mkdir -p "$HOME/.cache/ccache_mikernel"

      - name: "💾 Allocate 10GB Swap Memory"
        run: |
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: "🔨 Compile EXTREME++ Kernel"
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Ho_Chi_Minh
          KBUILD_BUILD_USER: "PandeyJi"
          KBUILD_BUILD_HOST: "ExtremePlusPlus"
          KSU_FLAVOR: "${{ inputs.ksu_flavor }}"
        run: |
          cd kernel
          TARGET_VAR="${{ inputs.variant }}"
          [ -z "$TARGET_VAR" ] && TARGET_VAR="all"
          KSU_MODE="noroot"
          if [ "${{ inputs.build_ksu }}" = "true" ]; then
            KSU_MODE="ksu"
          fi
          ./build_kernel.sh munch "$KSU_MODE" "$TARGET_VAR"

      - name: "🔍 Fetch Latest KernelSU Manager APKs (ARM64)"
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apk_output
          REPOS=(
            "rsuntk/KernelSU"
            "tiann/KernelSU"
            "Baka-SU/BakaSU"
            "SukiSU-Ultra/SukiSU-Ultra"
            "backslashxx/KernelSU"
            "KernelSU-Next/KernelSU-Next"
            "KOWX712/KernelSU"
          )

          for repo in "${REPOS[@]}"; do
            OWNER="${repo%%/*}"
            API_URL="https://api.github.com/repos/${repo}/releases"
            DATA=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API_URL")

            ASSET_INFO=$(echo "$DATA" | jq -r '
              [ .[] | {
                  tag: .tag_name, 
                  asset: (
                    (.assets[]? | select(.name | test("arm64-v8a.*\\.apk$"; "i"))) //
                    (.assets[]? | select(.name | test("universal.*\\.apk$"; "i"))) //
                    (.assets[]? | select(.name | test("\\.apk$"; "i")))
                  )
                } 
              ] | map(select(.asset != null)) | first // empty
            ')

            APK_URL=$(echo "$ASSET_INFO" | jq -r '.asset.browser_download_url // empty')
            RAW_FILE_NAME=$(echo "$ASSET_INFO" | jq -r '.asset.name // empty')
            VERSION_TAG=$(echo "$ASSET_INFO" | jq -r '.tag // empty')

            if [ -n "$APK_URL" ]; then
              if [[ "$repo" == "SukiSU-Ultra/SukiSU-Ultra" ]]; then
                FILE_NAME="Release_SukiSU_${RAW_FILE_NAME}"
              elif [[ "$repo" == "KernelSU-Next/KernelSU-Next" ]]; then
                FILE_NAME="KernelSU_Next_Manager_${VERSION_TAG}.apk"
              elif [[ "$repo" == "KOWX712/KernelSU" ]]; then
                FILE_NAME="Release_KowSU_${RAW_FILE_NAME}"
              else
                FILE_NAME="${OWNER}_Manager_${VERSION_TAG}.apk"
              fi
              curl -fLSs -o "apk_output/$FILE_NAME" "$APK_URL" || true
            fi
          done

      - name: "📦 Upload Kernel ZIPs & Manager APKs to Artifacts"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EXTREME++_Release_Bundle_${{ github.run_number }}
          path: |
            kernel/EXTREME++*.zip
            apk_output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: "🚀 Publish Kernel & KSU Managers to GitHub Release"
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "EXTREME++_munch_${{ github.run_number }}"
          name: "🔥 EXTREME++ Kernel #${{ github.run_number }} (${{ inputs.variant }}) + KSU Managers"
          body: |
            ### 🔥 EXTREME++ Official Release #${{ github.run_number }}
            - **📱 Device:** POCO F4 (`munch`)
            - **⚡ Root Core:** `${{ inputs.ksu_flavor }}` + SuSFS v2.3.0
            - **📲 Included Managers:** SukiSU-Ultra, KernelSU-Next, KowSU, ReSukiSU, BakaSU.
          files: |
            kernel/EXTREME++*.zip
            apk_output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
